# Render Configuration with Supabase Database
# Use this if you want to use Supabase for database instead of Render's PostgreSQL

services:
  - type: web
    name: farmlink-ai
    env: python
    buildCommand: |
      pip install --upgrade pip wheel setuptools
      pip install -r requirements.txt
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      
      # Build optimization - Enable pip caching
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: 1
      
      - key: PIP_NO_COMPILE
        value: 1
      
      # Supabase Database URL
      # Get this from Supabase Dashboard → Settings → Database → Connection String (URI)
      # Format: postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      
      # Session Secret (REQUIRED - generate a random string)
      - key: SESSION_SECRET
        sync: false  # Set manually in Render dashboard
      
      - key: FLASK_DEBUG
        value: 0
      
      - key: FLASK_ENV
        value: production
      
      - key: USE_JSON_LOGGING
        value: true
      
      # Add these manually in Render dashboard:
      # - GEMINI_API_KEY
      # - WEATHER_API_KEY
      # - AGMARKNET_API_KEY
      # - MAIL_USERNAME
      # - MAIL_PASSWORD
      # - MAIL_DEFAULT_SENDER
      # - RAZORPAY_KEY_ID
      # - RAZORPAY_KEY_SECRET
      # - KYC_ENCRYPTION_KEY (generate random 32 char string)
      # - ENCRYPTION_KEY (generate random 32 char string)
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET

# Note: No database section here because we're using Supabase
# Create database on Supabase.com and add connection string to Render
