<!-- Marketplace Call-to-Action Component -->
<!-- This component can be included in any dashboard to promote marketplace access -->

<div class="card border-primary shadow-sm mb-4 marketplace-cta-card">
    <div class="card-body p-4">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h4 class="card-title text-primary mb-2">
                    <i class="fas fa-store me-2"></i>Shop from Fellow Farmers
                </h4>
                <p class="card-text text-muted mb-3">
                    Browse quality crops from other farmers in your region. Find the best deals on seeds, fertilizers, and agricultural products.
                </p>
                <div class="d-flex gap-2 flex-wrap">
                    <a href="{{ url_for('marketplace') }}" class="btn btn-primary">
                        <i class="fas fa-shopping-cart me-2"></i>Browse Marketplace
                    </a>
                    <a href="{{ url_for('view_cart') }}" class="btn btn-outline-primary">
                        <i class="fas fa-shopping-bag me-2"></i>View Cart
                        <span class="badge bg-primary ms-1" id="cart-count-badge">0</span>
                    </a>
                </div>
            </div>
            <div class="col-md-4 text-center d-none d-md-block">
                <i class="fas fa-handshake fa-5x text-primary opacity-25"></i>
            </div>
        </div>
    </div>
</div>

<style>
.marketplace-cta-card {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    border-left: 5px solid #0d6efd;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.marketplace-cta-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(13, 110, 253, 0.15);
}
</style>

<script>
// Update cart count badge
function updateCartCount() {
    fetch('{{ url_for("get_cart_count") }}')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const badge = document.getElementById('cart-count-badge');
                if (badge) {
                    badge.textContent = data.count;
                    badge.style.display = data.count > 0 ? 'inline-block' : 'none';
                }
            }
        })
        .catch(error => console.error('Error fetching cart count:', error));
}

// Update on page load
document.addEventListener('DOMContentLoaded', updateCartCount);
</script>
