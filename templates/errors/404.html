{% extends "base.html" %}

{% block title %}Page Not Found - FarmLink AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="error-page">
                <h1 class="display-1 fw-bold text-success">404</h1>
                <h2 class="fw-bold mb-3">Page Not Found</h2>
                <p class="lead text-muted mb-4">
                    Oops! The page you're looking for seems to have wandered off like a lost crop in the field.
                </p>
                <div class="mb-4">
                    <i class="fas fa-seedling fa-5x text-muted"></i>
                </div>
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <a href="{{ url_for('index') }}" class="btn btn-success btn-lg">
                        <i class="fas fa-home me-2"></i>Go Home
                    </a>
                    <a href="{{ url_for('marketplace') }}" class="btn btn-outline-success btn-lg">
                        <i class="fas fa-store me-2"></i>Browse Marketplace
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
