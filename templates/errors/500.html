{% extends "base.html" %}

{% block title %}Server Error - FarmLink AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="error-page">
                <h1 class="display-1 fw-bold text-danger">500</h1>
                <h2 class="fw-bold mb-3">Server Error</h2>
                <p class="lead text-muted mb-4">
                    Something went wrong on our end. Our farmers are working hard to fix this issue!
                </p>
                <div class="mb-4">
                    <i class="fas fa-tools fa-5x text-muted"></i>
                </div>
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <a href="{{ url_for('index') }}" class="btn btn-success btn-lg">
                        <i class="fas fa-home me-2"></i>Go Home
                    </a>
                    <button onclick="window.location.reload()" class="btn btn-outline-success btn-lg">
                        <i class="fas fa-refresh me-2"></i>Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
