{% extends "base.html" %}

{% block title %}Report an Issue - FarmLink AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-primary bg-gradient text-white p-4 border-0">
                    <h3 class="mb-0 fw-bold"><i class="fas fa-headset me-2"></i>Support & Feedback</h3>
                    <p class="mb-0 text-white-50 mt-1">Report an issue, fraud, technical bug, or share your valuable suggestions with us.</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('report_issue') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Type of Request</label>
                            <select class="form-select" name="issue_type" required>
                                <optgroup label="Feedback & Ideas">
                                    <option value="suggestion">Feature Suggestion / Idea</option>
                                    <option value="bug">Technical Bug / Website Error</option>
                                </optgroup>
                                <optgroup label="Order & Seller Issues">
                                    <option value="fraud">Fraud / Fake Seller</option>
                                    <option value="quality">Bad Quality Produce</option>
                                    <option value="payment">Payment Problem</option>
                                    <option value="delivery">Delivery Delay / Not Received</option>
                                </optgroup>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Order ID (Optional)</label>
                            <input type="text" class="form-control" name="order_id" placeholder="e.g. ORD-12345">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Description of the Issue</label>
                            <textarea class="form-control" name="description" rows="5" placeholder="Please provide as much detail as possible so we can help you better..." required></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                                <i class="fas fa-paper-plane me-2"></i>Submit Request
                            </button>
                        </div>
                        <p class="text-muted text-center small mt-3">
                            Our team reviews all reports and feedback within 24 hours.
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
